<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>AI穿搭提示词生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f9fafb;color:#1f2937;min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}

/* === 头部 === */
.header{background:linear-gradient(135deg,#f43f5e,#ec4899);color:#fff;padding:16px 16px 14px;box-shadow:0 2px 8px rgba(244,63,94,.35)}
.header h1{font-size:17px;font-weight:700}
.header p{font-size:12px;color:#fecdd3;margin-top:2px}

/* === 主体 === */
.main{max-width:480px;margin:0 auto;padding:12px 12px 100px}

/* === 模板区 === */
.section{margin-bottom:14px}
.section-label{font-size:12px;color:#6b7280;font-weight:600;margin-bottom:8px;padding-left:2px}
.tpl-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.tpl-scroll::-webkit-scrollbar{height:2px}
.tpl-card{flex-shrink:0;min-width:120px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px 12px;cursor:pointer;transition:all .2s;text-align:left}
.tpl-card:hover{border-color:#f43f5e;box-shadow:0 2px 8px rgba(244,63,94,.15)}
.tpl-card .tpl-icon{font-size:15px}
.tpl-card .tpl-name{font-size:13px;font-weight:600;color:#374151;margin-top:2px}
.tpl-card .tpl-desc{font-size:11px;color:#9ca3af;margin-top:1px}

/* === 标签栏 === */
.tab-bar{position:sticky;top:0;z-index:10;background:#f9fafb;padding:8px 0;border-bottom:1px solid #e5e7eb;margin-bottom:10px}
.tab-scroll{display:flex;gap:6px;overflow-x:auto}
.tab-btn{display:flex-shrink:0;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;transition:all .2s;cursor:pointer;border:none;background:#fff;color:#6b7280;border:1px solid #e5e7eb}
.tab-btn.active{color:#fff;background:#f43f5e;border-color:#f43f5e}
.tab-count{font-size:10px;margin-left:2px}

/* === 内容卡片 === */
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

/* === 分类标题 === */
.cat-header{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cat-icon{font-size:11px;padding:2px 6px;border-radius:6px;font-weight:700;color:#fff}
.cat-title{font-size:13px;font-weight:700}
.cat-count{margin-left:auto;font-size:11px;color:#9ca3af}

/* === 手风琴 === */
.accordion-item{margin-bottom:6px}
.accordion-title{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:background .15s;user-select:none;background:#f3f4f6}
.accordion-title:hover{background:#e5e7eb}
.accordion-title .ai{font-size:13px}
.accordion-title .an{font-size:12px;font-weight:600;color:#374151}
.accordion-title .ac{margin-left:auto;font-size:11px;color:#9ca3af}
.accordion-body{padding:8px 4px 4px;display:none;flex-wrap:wrap;gap:6px}
.accordion-body.open{display:flex}

/* === 芯片 === */
.chip{padding:5px 11px;border-radius:99px;font-size:12px;border:1px solid #e5e7eb;background:#fff;color:#4b5563;cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:#f9a8d4;color:#ec4899}
.chip.selected{background:#f43f5e;color:#fff;border-color:#f43f5e}

/* === 预览区 === */
.preview-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:12px}
.preview-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.preview-title{font-size:13px;font-weight:700;color:#374151}
.copy-btn{font-size:12px;color:#f43f5e;font-weight:600;background:none;border:none;cursor:pointer;padding:0}
.copy-btn:active{color:#be123c}
.preview-text{min-height:50px;font-size:13px;color:#6b7280;line-height:1.7}
.preview-empty{color:#d1d5db;font-style:italic}
.divider{border:none;border-top:1px solid #f3f4f6;margin:10px 0}
.section-title{font-size:11px;color:#9ca3af;font-weight:600;margin-bottom:4px}
.neg-text{font-size:11px;color:#9ca3af}

/* === 底部操作栏 === */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:20;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.btn-row{display:flex;gap:10px;max-width:480px;margin:0 auto}
.btn-copy{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:700;background:#f43f5e;color:#fff;border:none;cursor:pointer;transition:background .2s}
.btn-copy:hover{background:#e11d48}
.btn-copy:disabled{background:#d1d5db;cursor:not-allowed}
.btn-copy:active{transform:scale(.98)}
.btn-clear{padding:12px 16px;border-radius:12px;font-size:13px;background:#fff;color:#6b7280;border:1px solid #e5e7eb;cursor:pointer}
.copied-flash{background:#10b981!important}

/* === 已选摘要 === */
.selected-summary{margin-top:10px;padding:10px 12px;background:#f9fafb;border-radius:12px}
.selected-label{font-size:11px;color:#9ca3af;margin-bottom:6px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:3px 8px;border-radius:99px;background:#fff;border:1px solid #e5e7eb;color:#6b7280}
</style>

// ================================================================
// 状态
// ================================================================
let activeTab = 'scene';
let selections = {};
let outfitSelections = {};
let copied = false;

function init() {
  selections = {};
  outfitSelections = {};
  renderTabs();
  renderContent();
  renderPreview();
  renderSummary();
  updateCopyBtn();
}

function toggleSimple(cat, id) {
  if (!selections[cat]) selections[cat] = [];
  const arr = selections[cat];
  const idx = arr.indexOf(id);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(id);
  renderContent();
  renderPreview();
  renderSummary();
  updateCopyBtn();
}

function toggleOutfit(sub, id) {
  if (!outfitSelections[sub]) outfitSelections[sub] = [];
  const arr = outfitSelections[sub];
  const idx = arr.indexOf(id);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(id);
  renderContent();
  renderPreview();
  renderSummary();
  updateCopyBtn();
}

function loadTemplate(tpl) {
  selections = {};
  outfitSelections = {};
  Object.entries(tpl.s).forEach(([k, ids]) => {
    if (k !== 'outfit') selections[k] = [...ids];
  });
  if (tpl.s.outfit) outfitSelections = JSON.parse(JSON.stringify(tpl.s.outfit));
  renderTabs();
  renderContent();
  renderPreview();
  renderSummary();
  updateCopyBtn();
}

function clearAll() {
  selections = {};
  outfitSelections = {};
  renderTabs();
  renderContent();
  renderPreview();
  renderSummary();
  updateCopyBtn();
}

// ================================================================
// 渲染：模板
// ================================================================
function renderTemplates() {
  const el = document.getElementById('tplScroll');
  el.innerHTML = TEMPLATES.map(t =>
    `<button class="tpl-card" onclick="loadTemplate(TEMPLATES.find(x=>x.id=='${t.id}'))" title="${t.desc}">
      <div class="tpl-icon">${t.icon}</div>
      <div class="tpl-name">${t.name}</div>
      <div class="tpl-desc">${t.desc}</div>
    </button>`
  ).join('');
}

// ================================================================
// 渲染：标签栏
// ================================================================
function renderTabs() {
  const el = document.getElementById('tabBar');
  el.innerHTML = TABS.map(tab => {
    const count = tab.id === 'outfit'
      ? Object.values(outfitSelections).reduce((a,b)=>a+(b?.length||0),0)
      : (selections[tab.id]?.length||0);
    return `<button class="tab-btn${activeTab===tab.id?' active':''}" onclick="switchTab('${tab.id}')">${tab.label}${count>0?`<span class="tab-count">(${count})</span>`:''}</button>`;
  }).join('');
}

// ================================================================
// 渲染：内容区
// ================================================================
function renderContent() {
  const el = document.getElementById('contentCard');

  if (activeTab === 'outfit') {
    const sub = BANKS.outfit;
    el.innerHTML = sub.subs.map(cat => {
      const sel = outfitSelections[cat.key]||[];
      return `
        <div class="accordion-item">
          <div class="accordion-title" onclick="toggleAccordion(this)">
            <span class="ai">${cat.icon}</span>
            <span class="an">${cat.title}</span>
            <span class="ac">${sel.length>0?`已选 ${sel.length} ▾`:'展开 ▾'}</span>
          </div>
          <div class="accordion-body">${cat.items.map(opt=>`
            <button class="chip${sel.includes(opt.id)?' selected':''}" onclick="toggleOutfit('${cat.key}','${opt.id}')">${opt.text}</button>
          `).join('')}</div>
        </div>`;
    }).join('');
  } else {
    const bank = BANKS[activeTab];
    const sel = selections[activeTab]||[];
    el.innerHTML = `
      <div class="cat-header">
        <span class="cat-icon" style="background:${bank.color}">${bank.icon}</span>
        <span class="cat-title" style="color:${bank.color}">${bank.label}</span>
        <span class="cat-count">${sel.length} 已选</span>
      </div>
      <div class="flex-wrap" style="display:flex;flex-wrap:wrap;gap:6px">${bank.items.map(opt=>`
        <button class="chip${sel.includes(opt.id)?' selected':''}" onclick="toggleSimple('${activeTab}','${opt.id}')">${opt.text}</button>
      `).join('')}</div>`;
  }
}

// ================================================================
// 渲染：预览
// ================================================================
function flatMap() {
  const r = {};
  Object.values(BANKS).forEach(b => {
    if (b.subs) b.subs.forEach(s => s.items?.forEach(i => { r[i.id] = i.text; }));
    else b.items?.forEach(i => { r[i.id] = i.text; });
  });
  return r;
}

function flatMapDesc() {
  const r = {};
  Object.values(BANKS).forEach(b => {
    if (b.subs) b.subs.forEach(s => s.items?.forEach(i => { r[i.id] = i.desc; }));
    else b.items?.forEach(i => { r[i.id] = i.desc; });
  });
  return r;
}

function buildPrompt() {
  const fm = flatMap();
  const parts = [];
  Object.values(selections).flat().forEach(id => { if (fm[id]) parts.push(fm[id]); });
  Object.values(outfitSelections).flat().forEach(id => { if (fm[id]) parts.push(fm[id]); });
  return parts.join('，');
}

function buildPromptEN() {
  const fm = flatMapDesc();
  const parts = [];
  Object.values(selections).flat().forEach(id => { if (fm[id]) parts.push(fm[id]); });
  Object.values(outfitSelections).flat().forEach(id => { if (fm[id]) parts.push(fm[id]); });
  return parts.join(', ');
}

function buildQuality() {
  const fm = flatMap();
  return (selections.quality||[]).map(id=>fm[id]).filter(Boolean).join('，');
}

  const promptCN = buildPrompt();
  const promptEN = buildPromptEN();
  const quality = buildQuality();
  const count = Object.values(selections).reduce((a,b)=>a+(b?.length||0),0)+Object.values(outfitSelections).reduce((a,b)=>a+(b?.length||0),0);

    <hr class="divider">
    <div style="font-size:11px;color:#9ca3af"><span style="font-weight:600;color:#6b7280">❌ 负面提示词：</span>${NEGATIVE}</div>`;
}

// ================================================================
// 渲染：摘要
// ================================================================
function renderSummary() {
  const fm = flatMap();
  const all = [
    ...Object.values(selections).flat().map(id=>({t:fm[id],k:id})),
    ...Object.values(outfitSelections).flat().map(id=>({t:fm[id],k:id}))
  ].filter(x=>x.t);
  const el = document.getElementById('summaryArea');
  if (!all.length) { el.innerHTML=''; return; }
  // 显示中文文本
  const cnMap = {};
  Object.values(BANKS).forEach(b=>{
    if(b.subs) b.subs.forEach(s=>s.items?.forEach(i=>{cnMap[i.id]=i.text}));
    else b.items?.forEach(i=>{cnMap[i.id]=i.text});
  });
  const allCN = [
    ...Object.values(selections).flat().map(id=>({t:cnMap[id],k:id})),
    ...Object.values(outfitSelections).flat().map(id=>({t:cnMap[id],k:id}))
  ].filter(x=>x.t);
  el.innerHTML = `
    <div class="selected-summary">
      <div class="selected-label">📌 已选标签 (${allCN.length})</div>
      <div class="tag-cloud">${allCN.map(x=>`<span class="tag">${x.t}</span>`).join('')}</div>
    </div>`;
}

// ================================================================
// 复制
// ================================================================
function doCopy() {
  const text = buildPromptEN();
  if (!text) return;
  // 优先用 Clipboard API（HTTPS），fallback 用 execCommand（HTTP兼容）
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(()=>{
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ 已复制到剪贴板！';
      btn.style.background = '#10b981';
      setTimeout(()=>{ btn.textContent = `📋 一键复制提示词 (${totalCount()}项)`; btn.style.background=''; }, 2000);
    }).catch(()=> fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function totalCount() {
  return Object.values(selections).reduce((a,b)=>a+(b?.length||0),0)+Object.values(outfitSelections).reduce((a,b)=>a+(b?.length||0),0);
}

function fallbackCopy(text) {
  // 创建临时 textarea 实现 HTTP 环境下的复制
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  try {
    const ok = document.execCommand('copy');
    if (ok) {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ 已复制到剪贴板！';
      btn.style.background = '#10b981';
      setTimeout(()=>{ btn.textContent = `📋 一键复制提示词 (${totalCount()}项)`; btn.style.background=''; }, 2000);
    } else {
      showCopyModal(text);
    }
  } catch(e) {
    showCopyModal(text);
  }
  document.body.removeChild(ta);
}

function showCopyModal(text) {
  // 如果连 execCommand 也失败，弹出模态框让用户长按复制
  const mask = document.createElement('div');
  mask.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:16px;padding:20px;max-width:90vw;max-height:80vh;overflow:auto;width:400px';
  box.innerHTML = '<div style="font-size:16px;font-weight:700;margin-bottom:10px">📋 请长按下方文字复制</div><div id="copyModalText" style="font-size:13px;line-height:1.6;background:#f3f4f6;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text">'+text.replace(/</g,'&lt;')+'</div><button style="margin-top:14px;width:100%;padding:12px;border-radius:12px;font-size:14px;font-weight:700;background:#f43f5e;color:#fff;border:none;cursor:pointer" onclick="this.closest(\'div\').parentElement.remove()">关闭</button>';
  mask.appendChild(box);
  mask.addEventListener('click', (e)=>{ if(e.target===mask) mask.remove(); });
  document.body.appendChild(mask);
}

function updateCopyBtn() {
  const count = totalCount();
  const btn = document.getElementById('copyBtn');
  btn.disabled = count === 0;
  btn.textContent = count > 0 ? `📋 一键复制提示词 (${count}项)` : '📋 一键复制提示词';
  btn.style.background = '';
}

// ================================================================
// 标签切换
// ================================================================
function switchTab(id) {
  activeTab = id;
  renderTabs();
  renderContent();
}

// ================================================================
// 手风琴
// ================================================================
function toggleAccordion(el) {
  const body = el.nextElementSibling;
  const wasOpen = body.classList.contains('open');
  // 关闭所有
  document.querySelectorAll('.accordion-body').forEach(b=>b.classList.remove('open'));
  document.querySelectorAll('.accordion-title .ac').forEach(ac=>{ac.textContent='展开 ▾';});
  if (!wasOpen) {
    body.classList.add('open');
    el.querySelector('.ac').textContent = '收起 ▴';
  }
}

// ================================================================
// 启动
// ================================================================
renderTemplates();
init();
</script>
</body>
</html>
